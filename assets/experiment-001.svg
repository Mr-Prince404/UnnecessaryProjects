<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-label="Experimento 001 Juego de la viborita">
  <defs>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0C101B"/>
      <stop offset="1" stop-color="#101D1C"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#39FF88"/>
      <stop offset="1" stop-color="#00E5FF"/>
    </linearGradient>
    <pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.2" fill="#8BE8C0" opacity=".12"/>
    </pattern>
  </defs>

  <rect width="1100" height="250" rx="24" fill="url(#panel)"/>
  <rect width="1100" height="250" rx="24" fill="url(#dots)"/>
  <rect x="1.5" y="1.5" width="1097" height="247" rx="22.5" fill="none" stroke="#2EE59D" stroke-opacity=".45" stroke-width="3"/>

  <g font-family="Consolas, 'Courier New', monospace">
    <text x="44" y="48" fill="#65FFAF" font-size="18" letter-spacing="2">EXPERIMENT // 001</text>
    <text x="44" y="103" fill="#FFFFFF" font-size="40" font-weight="800">🐍 JUEGO DE LA VIBORITA</text>
    <text x="44" y="144" fill="#B8C5D8" font-size="21">Snake + consecuencias + comentarios poco constructivos.</text>

    <g transform="translate(44,181)">
      <rect width="120" height="38" rx="19" fill="#143226" stroke="#39FF88" stroke-opacity=".55"/>
      <text x="60" y="25" text-anchor="middle" fill="#9BFFC5" font-size="15" font-weight="700">PYTHON</text>

      <rect x="136" width="120" height="38" rx="19" fill="#112B31" stroke="#00E5FF" stroke-opacity=".55"/>
      <text x="196" y="25" text-anchor="middle" fill="#9AEFFF" font-size="15" font-weight="700">PYGAME</text>

      <rect x="272" width="90" height="38" rx="19" fill="#2B1630" stroke="#FF4ECD" stroke-opacity=".55"/>
      <text x="317" y="25" text-anchor="middle" fill="#FFB2E8" font-size="15" font-weight="700">V5</text>
    </g>

    <g transform="translate(825,36)">
      <circle cx="0" cy="14" r="7" fill="#39FF88">
        <animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/>
      </circle>
      <text x="20" y="20" fill="#9BFFC5" font-size="17" font-weight="700">CONTAINED ✓</text>
    </g>
  </g>

  <path d="M760 90c40-26 78-8 94 14 17 24 9 56-18 67-30 13-64-8-53-34 11-26 49-17 43 5-6 24-43 20-63 8-20-12-37-32-41-55" fill="none" stroke="url(#line)" stroke-width="7" stroke-linecap="round" opacity=".85">
    <animate attributeName="stroke-dasharray" values="0 500;260 80;0 500" dur="5s" repeatCount="indefinite"/>
  </path>
  <circle cx="718" cy="90" r="8" fill="#39FF88"/>
</svg>